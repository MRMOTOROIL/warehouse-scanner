<!DOCTYPE html>

<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">



  <meta

    name="viewport"

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"

  >



  <title>樵玟出貨掃碼</title>



  <style>

    :root {

      --bg: #f3f5f7;

      --card: #ffffff;

      --text: #202124;

      --sub: #687078;

      --border: #dfe3e7;



      --blue: #1558a6;

      --blue-bg: #e8f1ff;



      --green: #117333;

      --green-bg: #dcf3e3;



      --red: #b3261e;

      --red-bg: #fde2df;



      --purple: #6d28a8;

      --purple-bg: #f2e7ff;

    }



    * {

      box-sizing: border-box;

      -webkit-tap-highlight-color: transparent;

    }



    html,

    body {

      margin: 0;

      width: 100%;

      min-height: 100%;

      background: var(--bg);

      color: var(--text);



      font-family:

        Arial,

        "Microsoft JhengHei",

        sans-serif;



      -webkit-text-size-adjust: 100%;

      text-size-adjust: 100%;

    }



    body {

      padding:

        max(8px, env(safe-area-inset-top))

        8px

        max(92px, calc(78px + env(safe-area-inset-bottom)));

    }



    .app {

      width: 100%;

      min-width: 100%;

      max-width: none;

      margin: 0;

      padding: 0;

    }



    .header {

      text-align: center;

      padding: 4px 4px 10px;

    }



    .header-title {

      margin: 0;

      font-size: 25px;

      font-weight: 900;

    }



    .header-sub {

      margin-top: 4px;

      color: var(--sub);

      font-size: 14px;

    }



    /* =========================

       狀態

    ========================= */



    .status {

      width: 100%;

      border-radius: 20px;

      padding: 24px 12px;

      text-align: center;

      margin-bottom: 10px;

    }



    .status.waiting {

      background: var(--blue-bg);

      color: var(--blue);

    }



    .status.success {

      background: var(--green-bg);

      color: var(--green);

    }



    .status.error {

      background: var(--red-bg);

      color: var(--red);

    }



    .status.learning {

      background: var(--purple-bg);

      color: var(--purple);

    }



    .status-title {

      font-size: 32px;

      line-height: 1.2;

      font-weight: 900;

    }

    .status-message {

      margin-top: 8px;

      font-size: 19px;

      line-height: 1.45;

      font-weight: 800;

      word-break: break-word;

    }



    /* =========================

       一般卡片

    ========================= */



    .card {

      width: 100%;

      background: #fff;

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 14px;

      margin-bottom: 10px;

    }



    .section-title {

      font-size: 19px;

      font-weight: 900;

      margin-bottom: 9px;

    }



    .empty {

      color: var(--sub);

      font-size: 16px;

      padding: 5px 0;

    }



    /* =========================

       商品

    ========================= */



    .item {

      border: 1px solid var(--border);

      border-radius: 15px;

      padding: 14px;

      margin-bottom: 9px;

      background: #fff;

    }



    .item:last-child {

      margin-bottom: 0;

    }



    .item.done {

      background: #e5f5e9;

      border-color: #8bc89b;

    }



    .item-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 8px;

    }



    .item-name {

      font-size: 24px;

      font-weight: 900;

      line-height: 1.25;

    }



    .item-code {

      margin-top: 4px;

      font-size: 15px;

      color: var(--sub);

    }



    .item-count {

      flex-shrink: 0;

      min-width: 84px;

      text-align: right;

      font-size: 32px;

      font-weight: 900;

    }



    .progress {

      margin-top: 10px;

      width: 100%;

      height: 14px;

      background: #e7eaed;

      border-radius: 999px;

      overflow: hidden;

    }



    .progress-bar {

      height: 100%;

      width: 0;

      background: #188038;

      border-radius: 999px;

      transition: width .15s;

    }



    /* =========================

       託運單

    ========================= */



    .order-row {

      padding: 10px 0;

      border-bottom: 1px solid #eee;

      font-size: 15px;

      line-height: 1.45;

      word-break: break-word;

    }



    .order-row:last-child {

      border-bottom: 0;

    }



    /* =========================

       箱裝

    ========================= */



    .ignored {

      background: #f5f6f7;

      border-radius: 10px;

      padding: 9px;

      margin-bottom: 6px;

      color: #6e747a;

      font-size: 14px;

      line-height: 1.4;

    }



    /* =========================

       學習

    ========================= */



    .learning-box {

      display: none;

      background: #faf5ff;

      border: 2px solid #a979d6;

      border-radius: 17px;

      padding: 14px;

      margin-bottom: 10px;

    }



    .learning-box.show {

      display: block;

    }



    .learning-title {

      font-size: 22px;

      font-weight: 900;

      color: var(--purple);

      margin-bottom: 10px;

    }



    .learning-line {

      font-size: 17px;

      line-height: 1.5;

      margin-bottom: 5px;

      word-break: break-all;

    }



    /* =========================

       按鈕

    ========================= */



    button {

      border: 0;

      cursor: pointer;

      font-family: inherit;

    }



    .btn {

      min-height: 52px;

      border-radius: 13px;

      padding: 11px 12px;

      font-size: 17px;

      font-weight: 900;

    }



    .btn-green {

      background: #188038;

      color: white;

    }



    .btn-gray {

      background: #5f6368;

      color: white;

    }



    .btn-red {

      background: #d93025;

      color: white;

    }



    .btn-blue {

      background: #1a73e8;

      color: white;

    }



    .two-buttons {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 12px;

    }



    /* =========================

       歷史

    ========================= */



    .history-row {

      padding: 9px 0;

      border-bottom: 1px solid #eee;

      font-size: 14px;

      line-height: 1.4;

      word-break: break-word;

    }



    .history-ok {

      color: #117333;

    }



    .history-error {

      color: #b3261e;

    }



    .history-info {

      color: #174ea6;

    }



    /* =========================

       底部固定操作列

    ========================= */



    .bottom-bar {

      position: fixed;

      z-index: 100;



      left: 0;

      right: 0;

      bottom: 0;



      padding:

        8px

        8px

        max(8px, env(safe-area-inset-bottom));



      background: rgba(255,255,255,.96);

      backdrop-filter: blur(8px);



      border-top: 1px solid #d9dcdf;

    }



    .bottom-buttons {

      width: 100%;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 7px;

    }






    @media (min-width: 800px) {

      body {

        padding-left: 14px;

        padding-right: 14px;

      }



      .app,

      .bottom-buttons {

        max-width: 900px;

        margin-left: auto;

        margin-right: auto;

      }

    }

  </style>

</head>



<body>



<div class="app">




  <div class="status waiting" id="status">
    <div id="statusTitle" class="status-title">樵玟出貨掃碼</div>
    <div id="statusMessage" class="status-message">掃描託運單 → 掃描商品</div>
  </div>

  <div class="card">
    <div class="section-title">託運單號 <span id="trackingNumberInline"></span></div>
    <div id="ordersArea"><div class="empty">尚未掃描</div></div>
  </div>

  <div class="card">
    <div class="section-title">商品</div>
    <div id="itemsArea"><div class="empty">請先掃描託運單</div></div>
  </div>

  <div id="ignoredSection" class="card" style="display:none;">
    <div class="section-title" style="color:#b3261e;">此件有原廠箱</div>
    <div id="ignoredArea"></div>
  </div>

  <!-- 新品學習 -->



  <div

    id="learningBox"

    class="learning-box"

  >



    <div class="learning-title">新增商品條碼</div>



    <div class="learning-line">

      新增品項

      <strong id="learnName"></strong>

    </div>



    <div class="learning-line">

      商品條碼：

      <strong id="learnBarcode"></strong>

    </div>



    <div class="two-buttons">



      <button

        class="btn btn-green"

        onclick="confirmLearning()"

      >

        確認建立

      </button>



      <button

        class="btn btn-gray"

        onclick="cancelLearning()"

      >

        取消

      </button>



    </div>



  </div>










<!-- 固定底部 -->



<div class="bottom-bar">



  <div class="bottom-buttons">



    <button

      class="btn btn-red"

      onclick="clearBatch(true)"

    >

      清除批次

    </button>



    <button

      class="btn btn-gray"

      onclick="reloadBarcodeMap()"

    >

      更新資料

    </button>



  </div>



</div>





<script>


/* =========================================================
   Vercel API
========================================================= */

async function apiCall(action, payload = {}) {
  const response = await fetch('/api/scan', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      action,
      ...payload
    })
  });

  let result;

  try {
    result = await response.json();
  } catch (error) {
    throw new Error('API 回應不是有效 JSON');
  }

  if (!response.ok) {
    throw new Error(
      result.message ||
      ('API 錯誤 HTTP ' + response.status)
    );
  }

  return result;
}




/* =========================================================

   系統狀態

========================================================= */



let products = [];

let barcodeMap = {};

let shippingNameMap = {};



let currentOrders = [];

let requiredItems = {};

let scannedItems = {};

let ignoredItems = [];

let historyData = [];



let busy = false;



let learningMode = false;

let pendingLearningName = '';

let pendingLearningBarcode = '';



let batchCompleted = false;





/* =========================================================
   掃碼槍：Bluetooth HID 鍵盤輸入
========================================================= */

let scannerBuffer = '';
let scannerBufferTimer = null;

document.addEventListener('keydown', function(event) {

  if (event.ctrlKey || event.altKey || event.metaKey) return;

  if (event.key === 'Enter') {

    if (!scannerBuffer) return;

    event.preventDefault();

    const value = scannerBuffer.trim();
    scannerBuffer = '';

    if (scannerBufferTimer) {
      clearTimeout(scannerBufferTimer);
      scannerBufferTimer = null;
    }

    if (value) handleScan(value, 'scanner');
    return;
  }

  if (event.key && event.key.length === 1) {

    scannerBuffer += event.key;

    if (scannerBufferTimer) clearTimeout(scannerBufferTimer);

    scannerBufferTimer = setTimeout(function() {

      const value = scannerBuffer.trim();
      scannerBuffer = '';
      scannerBufferTimer = null;

      if (value) handleScan(value, 'scanner');

    }, 120);
  }
});


/* =========================================================

   掃描主入口

========================================================= */



function handleScan(rawValue, source = 'scanner') {

  const value = normalizeBarcode(rawValue);

  if (!value || busy) return;

  /* 所有掃描輸入一律限制為純數字 */
  if (!/^\d+$/.test(value)) {
    showError('掃描格式錯誤', '掃描內容必須為數字');
    return;
  }

  if (learningMode) {
    handleLearningBarcode(value);
    return;
  }

  /* 未掃託運單時，只接受 12 碼純數字 */
  if (currentOrders.length === 0) {

    if (/^\d{12}$/.test(value)) {
      lookupTracking(value);
    } else {
      showError('託運單號錯誤', '請掃描 12 碼數字託運單');
    }

    return;
  }

  /* 已有託運單後，掃描商品 */
  if (barcodeMap[value]) {
    handleKnownProductScan(value);
    return;
  }

  /* 有尚未建檔商品時，未知條碼進入學習 */
  const unknownName = getFirstUnknownRequiredItem();

  if (unknownName) {
    startLearning(unknownName, value);
    return;
  }

  showError('無法辨識條碼', value);
}


/* =========================================================

   託運單

========================================================= */



async function lookupTracking(

  trackingNumber

) {



  /*

    前端再次保險：

    託運單必須是12碼純數字

  */

  if (

    !/^\d{12}$/.test(

      trackingNumber

    )

  ) {



    return;



  }





  if (batchCompleted) {



    clearBatch(false);



  }





  busy = true;





  setStatus(

    'waiting',

    '查詢託運單',

    trackingNumber

  );





  try {



    /*

      注意：



      Apps Script API 名稱是

      lookupTrackingNumber



      參數名稱也是

      trackingNumber

    */

    const result =

      await apiCall(

        'lookupTrackingNumber',

        {

          trackingNumber:

            trackingNumber

        }

      );





    busy = false;





    if (!result.ok) {



      showError(

        '找不到託運單',

        result.message ||

        trackingNumber

      );





      addHistory(

        trackingNumber,

        '❌ ' +

        (

          result.message ||

          '找不到託運單'

        ),

        'error'

      );





      return;



    }





    addTrackingResult(

      result

    );



  }



  catch (error) {



    busy = false;





    showError(

      '查詢失敗',

      error.message ||

      String(error)

    );



  }



}





/* =========================================================

   加入託運單

========================================================= */



function addTrackingResult(

  result

) {



  const duplicate =

    currentOrders.some(

      order =>

        order.trackingNumber ===

        result.trackingNumber

    );





  if (duplicate) {



    showError(

      '重複託運單',

      result.trackingNumber

    );



    return;

  }





  currentOrders.push({



    trackingNumber:

      result.trackingNumber,



    rawProductText:

      result.rawProductText,



    items:

      result.items || [],



    ignoredItems:

      result.ignoredItems || []



  });





  (result.items || [])

    .forEach(

      function(item) {



        const name =

          normalizeShippingItemName(

            item.productName

          );





        if (

          !requiredItems[name]

        ) {



          requiredItems[name] = {



            shippingName:

              name,



            requiredQty:

              0



          };

        }





        requiredItems[name]

          .requiredQty +=

            Number(

              item.qty || 0

            );





        if (

          scannedItems[name] ===

          undefined

        ) {



          scannedItems[name] = 0;

        }



      }

    );





  (result.ignoredItems || [])

    .forEach(

      function(item) {



        ignoredItems.push({



          trackingNumber:

            result.trackingNumber,



          raw:

            item.raw,



          reason:

            item.reason



        });



      }

    );





  playShortBeep();





  setStatus(

    'waiting',

    '託運單已加入',

    result.rawProductText

  );





  addHistory(

    result.trackingNumber,

    '✅ ' +

      result.rawProductText,

    'ok'

  );





  renderAll();





  if (

    getTotalRequiredQty() === 0

  ) {



    completeBatchIfReady();



    return;

  }





  const unknown =

    getFirstUnknownRequiredItem();





  if (unknown) {



    setStatus(

      'learning',

      '新品尚未建檔',

      '請掃描 ' +

      unknown +

      ' 的商品條碼'

    );



  }

  else {



    setStatus(

      'waiting',

      '請掃描商品',

      '依下方數量逐件掃描'

    );



  }

}





/* =========================================================

   商品掃描

========================================================= */



function handleKnownProductScan(

  barcode

) {



  if (

    currentOrders.length === 0

  ) {



    showError(

      '請先掃託運單',

      barcodeMap[barcode]

        .shippingName

    );



    return;

  }





  const product =

    barcodeMap[barcode];





  const name =

    normalizeProductName(

      product.shippingName

    );





  if (

    !requiredItems[name]

  ) {



    showError(

      '🚨 商品錯誤',

      '本批不需要 ' +

      name

    );





    addHistory(

      barcode,

      '❌ 錯誤商品 ' +

      name,

      'error'

    );





    return;

  }





  const required =

    requiredItems[name]

      .requiredQty;





  const scanned =

    scannedItems[name] || 0;





  if (

    scanned >= required

  ) {



    showError(

      '🚨 數量超過',

      name +

      ' 已完成 ' +

      scanned +

      '/' +

      required

    );





    return;

  }





  scannedItems[name] =

    scanned + 1;





  playShortBeep();





  setStatus(

    'success',

    '商品正確',

    name +

    '　' +

    scannedItems[name] +

    '/' +

    required

  );





  addHistory(

    barcode,

    '✅ ' +

      name +

      ' ' +

      scannedItems[name] +

      '/' +

      required,

    'ok'

  );





  renderAll();





  completeBatchIfReady();

}





/* =========================================================

   新品學習

========================================================= */



function getFirstUnknownRequiredItem() {



  const names =

    Object.keys(

      requiredItems

    );





  for (

    let i = 0;

    i < names.length;

    i++

  ) {



    const name =

      names[i];





    if (

      !shippingNameMap[name] ||

      shippingNameMap[name]

        .length === 0

    ) {



      return name;

    }





    const hasBarcode =

      shippingNameMap[name]

        .some(

          product =>

            !!normalizeBarcode(

              product.barcode

            )

        );





    if (!hasBarcode) {



      return name;

    }



  }





  return '';

}





function startLearning(

  shippingName,

  barcode

) {



  learningMode = true;



  pendingLearningName =

    shippingName;



  pendingLearningBarcode =

    barcode;





  document

    .getElementById(

      'learnName'

    )

    .textContent =

      shippingName;





  document

    .getElementById(

      'learnBarcode'

    )

    .textContent =

      barcode;





  document

    .getElementById(

      'learningBox'

    )

    .classList.add(

      'show'

    );





  setStatus(

    'learning',

    '確認新品條碼',

    shippingName

  );





  playLearningBeep();

}





function handleLearningBarcode(

  barcode

) {



  pendingLearningBarcode =

    barcode;





  document

    .getElementById(

      'learnBarcode'

    )

    .textContent =

      barcode;

}





async function confirmLearning() {

  if (
    !pendingLearningName ||
    !pendingLearningBarcode
  ) {
    return;
  }

  const learnedName =
    pendingLearningName;

  const learnedBarcode =
    pendingLearningBarcode;

  busy = true;

  try {

    const result = await apiCall(
      'learnProduct',
      {
        shippingName: learnedName,
        barcode: learnedBarcode
      }
    );

    busy = false;

    if (!result.ok) {

      showError(
        result.conflict
          ? '條碼衝突'
          : '無法建立',
        result.message || '建立失敗'
      );

      return;
    }

    cancelLearning();

    addHistory(
      learnedBarcode,
      '✅ 已學習 ' + learnedName,
      'info'
    );

    await reloadBarcodeMap();

    if (
      barcodeMap[learnedBarcode]
    ) {
      handleKnownProductScan(
        learnedBarcode
      );
    }

  }
  catch (error) {

    busy = false;

    showError(
      '學習失敗',
      error.message || String(error)
    );
  }
}


function cancelLearning() {



  learningMode = false;



  pendingLearningName = '';



  pendingLearningBarcode = '';





  document

    .getElementById(

      'learningBox'

    )

    .classList.remove(

      'show'

    );



}





/* =========================================================

   完成

========================================================= */



function isBatchComplete() {



  const names =

    Object.keys(

      requiredItems

    );





  if (

    names.length === 0

  ) {



    return (

      currentOrders.length > 0

    );

  }





  return names.every(

    function(name) {



      return (

        (

          scannedItems[name] ||

          0

        )

        >=

        (

          requiredItems[name]

            .requiredQty ||

          0

        )

      );



    }

  );

}





function completeBatchIfReady() {



  if (

    !isBatchComplete()

  ) {

    return;

  }





  batchCompleted = true;





  setStatus(

    'success',

    '✅ 本批完成',

    getTotalRequiredQty() === 0

      ? '箱裝商品，不需逐件掃描'

      : '所有商品數量正確'

  );





  playCompleteSound();





  addHistory(

    '',

    '✅ 本批完成',

    'ok'

  );





  writeCompletionLog();

}





/* =========================================================

   完成紀錄

========================================================= */



async function writeCompletionLog() {

  const trackingNumbers =
    currentOrders.map(
      order => order.trackingNumber
    );

  const rawTexts =
    currentOrders.map(
      order => order.rawProductText
    );

  const items = [];

  Object.keys(requiredItems)
    .forEach(
      function(name) {

        const product =
          getProductByShippingName(name);

        items.push({
          shippingName: name,
          productCode:
            product
              ? product.productCode
              : '',
          requiredQty:
            requiredItems[name].requiredQty,
          scannedQty:
            scannedItems[name] || 0
        });
      }
    );

  if (items.length === 0) {
    return;
  }

  try {

    await apiCall(
      'logBatchCompletion',
      {
        trackingNumbers,
        rawProductTexts: rawTexts,
        items
      }
    );

  }
  catch (error) {

    addHistory(
      '',
      '⚠️ 完成紀錄寫入失敗：' +
        (error.message || String(error)),
      'error'
    );
  }
}

/* =========================================================

async function reloadBarcodeMap(callback) {

  setStatus(
    'waiting',
    '更新商品資料',
    '請稍候'
  );

  try {

    const result =
      await apiCall(
        'getBarcodeMap'
      );

    if (!result.ok) {

      showError(
        '商品資料錯誤',
        result.message || '無法讀取商品資料'
      );

      return;
    }

    products =
      result.products || [];

    barcodeMap = {};
    shippingNameMap = {};

    products.forEach(
      function(product) {

        const name =
          normalizeProductName(
            product.shippingName
          );

        const barcode =
          normalizeBarcode(
            product.barcode
          );

        if (!shippingNameMap[name]) {
          shippingNameMap[name] = [];
        }

        shippingNameMap[name]
          .push(product);

        if (barcode) {
          barcodeMap[barcode] =
            product;
        }
      }
    );

    if (currentOrders.length === 0) {

      setStatus(
        'waiting',
        '樵玟出貨掃碼',
        '掃描託運單 → 掃描商品'
      );
    }

    renderAll();

    if (
      typeof callback === 'function'
    ) {
      callback();
    }

    return result;

  }
  catch (error) {

    showError(
      '載入失敗',
      error.message || String(error)
    );

    throw error;
  }
}


function getProductByShippingName(

  name

) {



  const list =

    shippingNameMap[

      normalizeProductName(

        name

      )

    ];





  return (

    list &&

    list.length

      ? list[0]

      : null

  );

}

function clearBatch(

  showMessage = true

) {



  currentOrders = [];

  requiredItems = {};

  scannedItems = {};

  ignoredItems = [];

  batchCompleted = false;





  cancelLearning();





  renderAll();





  if (showMessage) {



    setStatus(

      'waiting',

      '批次已清除',

      '請掃描下一張託運單'

    );



  }

}





/* =========================================================

   畫面

========================================================= */



function renderAll() {
  renderItems();
  renderOrders();
  renderIgnored();
}





function renderItems() {

  const area = document.getElementById('itemsArea');
  const names = Object.keys(requiredItems);

  if (names.length === 0) {
    area.innerHTML =
      '<div class="empty">' +
      (currentOrders.length ? '沒有需要逐件掃描的商品' : '請先掃描託運單') +
      '</div>';
    return;
  }

  area.innerHTML = '';

  names.forEach(function(name) {

    const required = Number(requiredItems[name].requiredQty || 0);
    const scanned = Number(scannedItems[name] || 0);
    const done = scanned >= required;

    const div = document.createElement('div');
    div.className = 'item' + (done ? ' done' : '');

    div.innerHTML = `
      <div class="item-top">
        <div class="item-name">${escapeHtml(name)}</div>
        <div class="item-count">${done ? '✓' : ''}</div>
      </div>
    `;

    area.appendChild(div);
  });
}


function renderOrders() {

  const inline = document.getElementById("trackingNumberInline");
  if (inline) inline.textContent = currentOrders.length ? currentOrders.map(o => o.trackingNumber).join("、") : "";

  const area = document.getElementById('ordersArea');

  if (currentOrders.length === 0) {
    area.innerHTML = '<div class="empty">尚未掃描</div>';
    return;
  }

  /* 託運單號已直接顯示在「託運單號」標題後方，不再重複列出。 */
  area.innerHTML = '';
}


function renderIgnored() {



  const section =

    document.getElementById(

      'ignoredSection'

    );





  const area =

    document.getElementById(

      'ignoredArea'

    );





  if (

    ignoredItems.length === 0

  ) {



    section.style.display =

      'none';



    area.innerHTML = '';



    return;

  }





  section.style.display =

    'block';



  area.innerHTML = '';





  ignoredItems.forEach(

    function(item) {



      const div =

        document.createElement(

          'div'

        );





      div.className =

        'ignored';





      div.textContent = item.raw;





      area.appendChild(

        div

      );



    }

  );

}

function getTotalRequiredQty() {



  return Object.keys(

    requiredItems

  )

  .reduce(

    function(total, name) {



      return (

        total +

        Number(

          requiredItems[name]

            .requiredQty ||

          0

        )

      );



    },

    0

  );

}





function getTotalScannedQty() {



  return Object.keys(

    scannedItems

  )

  .reduce(

    function(total, name) {



      return (

        total +

        Number(

          scannedItems[name] ||

          0

        )

      );



    },

    0

  );

}

/* =========================================================

   音效

========================================================= */



function tone(

  frequency,

  duration,

  volume = 0.24

) {



  try {



    const AudioContext =

      window.AudioContext ||

      window.webkitAudioContext;





    const ctx =

      new AudioContext();





    const oscillator =

      ctx.createOscillator();





    const gain =

      ctx.createGain();





    oscillator.connect(

      gain

    );





    gain.connect(

      ctx.destination

    );





    oscillator.frequency.value =

      frequency;





    gain.gain.setValueAtTime(

      volume,

      ctx.currentTime

    );





    gain.gain

      .exponentialRampToValueAtTime(

        0.001,

        ctx.currentTime +

        duration

      );





    oscillator.start();





    oscillator.stop(

      ctx.currentTime +

      duration

    );



  }



  catch (e) {}



}

/* =========================================================

   字串

========================================================= */



function normalizeBarcode(

  value

) {



  return String(

    value || ''

  )

  .replace(/\r/g, '')

  .replace(/\n/g, '')

  .replace(/\s+/g, '')

  .trim();



}





function normalizeShippingItemName(value) {

  let text = String(value || '').trim();

  /* 防呆：即使 API 回傳「2*福14」，前端仍以真正商品名稱「福14」處理。 */
  text = text.replace(/^\d+\s*[\*＊]\s*/, '');

  /* 支援來源資料尾端數量格式，例如 森A091(★單品)x6 */
  text = text.replace(/^(.+?)\\s*[xX×]\\s*\\d+$/, '$1');

  return normalizeProductName(text);
}


function normalizeProductName(

  value

) {



  return String(

    value || ''

  )

  .replace(/（/g, '(')

  .replace(/）/g, ')')

  .replace(/\s+/g, ' ')

  .trim()

  .replace(

    '(★單件)',

    '(★單品)'

  );



}





function escapeHtml(

  text

) {



  return String(

    text || ''

  )

  .replace(/&/g, '&amp;')

  .replace(/</g, '&lt;')

  .replace(/>/g, '&gt;')

  .replace(/"/g, '&quot;')

  .replace(/'/g, '&#039;');



}
